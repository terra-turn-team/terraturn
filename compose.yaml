services:
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/terraturn.db
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env antes de iniciar}
      FRONTEND_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      PASSWORD_RESET_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  backend-data:
