name: Manter API acordada

# O plano grátis do Render desliga a API depois de ~15 min sem acesso, e o primeiro acesso seguinte leva ~50 s.
# Este job chama a API pelo próprio site (Cloudflare -> Render) a cada 10 min para ela continuar ligada.
# Só faz GET em /health: não grava nada e não usa a chave da Anthropic.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar /api/v1/health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 90 https://terraturn.work/api/v1/health || true)
            echo "tentativa $i: HTTP $code $(cat /tmp/health.json 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::A API não respondeu 200 em 3 tentativas"
          exit 1
