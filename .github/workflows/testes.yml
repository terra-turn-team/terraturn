name: Testes

# Roda em cada PR para a main. A IA é sempre simulada: nenhuma chamada à Anthropic.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend - dependências
        run: pip install -r backend/requirements.txt

      - name: Backend - testes
        working-directory: backend
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - dependências, testes e build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Playwright (sem alterar o package-lock)
        working-directory: frontend
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Subir API e site locais
        run: |
          export JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          (cd backend && DATABASE_URL=sqlite:///./e2e.db DEMO_AUTOGENERATE=false DEMO_EDITABLE=true ANTHROPIC_API_KEY= \
            nohup python -m uvicorn app.main:app --port 8000 > ../api.log 2>&1 &)
          (cd frontend && nohup npx vite --port 5173 --strictPort > ../vite.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/v1/health > /dev/null && curl -sf http://localhost:5173 > /dev/null && exit 0
            sleep 2
          done
          cat api.log vite.log; exit 1

      - name: Testes de ponta a ponta (desktop e celular)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run test:e2e

      - name: Capturas de tela e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-capturas
          path: |
            frontend/e2e-screenshots
            api.log
            vite.log
          if-no-files-found: ignore
